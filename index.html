<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ali FX</title>
<style>
:root{--bg:#f4f6fa;--cd:#fff;--tx:#12161c;--mu:#5d6673;--ac:#b8860b;--gd:#0a8f4e;--rd:#d12f3a;--bd:#dde1e7;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0e13;--cd:#151a21;--tx:#e8ebf0;--mu:#8f98a5;--ac:#e8b73a;--gd:#3ccf85;--rd:#ff6b75;--bd:#232a34;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b0e13;--cd:#151a21;--tx:#e8ebf0;--mu:#8f98a5;--ac:#e8b73a;--gd:#3ccf85;--rd:#ff6b75;--bd:#232a34;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:14px}
.logo{font-size:30px;font-weight:900;letter-spacing:1px;color:var(--ac);margin:2px 0}
.logo small{display:block;font-size:12px;font-weight:500;color:var(--mu);letter-spacing:0}
.card{background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:12px}
label{display:block;font-size:12px;color:var(--mu);margin-bottom:3px}
input,select,button{font:inherit;border-radius:8px;border:1px solid var(--bd);padding:10px;background:var(--bg);color:var(--tx);width:100%}
button{background:var(--ac);color:#111;border:0;font-weight:700;margin-top:10px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg button{margin:0;background:var(--bg);color:var(--mu);border:1px solid var(--bd)}
.seg button.on{background:var(--ac);color:#111;border-color:var(--ac)}
.g{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.ch{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
.ch label{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--tx);margin:0}
.ch input{width:auto}
.note{font-size:12px;color:var(--mu);margin-top:6px}
.err{color:var(--rd);font-size:13px;margin-top:6px}
.h{display:flex;justify-content:space-between;align-items:center}
.tag{padding:3px 10px;border-radius:6px;font-weight:800;color:#fff}
.buy{background:var(--gd)}.sell{background:var(--rd)}
.gr{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px;font-size:11px;color:var(--mu)}
.gr b{display:block;font-size:13px;color:var(--tx)}
#app{display:none}
</style>
</head>
<body>
<main>
<div id="lock" class="card" style="margin-top:12vh">
  <div class="logo">ALI FX<small>Forex Signals</small></div>
  <label id="lockLbl">Password</label>
  <input id="pw" type="password">
  <button id="lockBtn">Login</button>
  <div id="lockErr" class="err"></div>
</div>
<div id="app">
  <div class="logo">ALI FX<small>Scalp + Intraday | Price Action, SMC, ICT</small></div>
  <div class="card">
    <div class="seg"><button id="m_scalp" class="on">⚡ Scalping</button><button id="m_intra">📈 Intraday (3-4 ghante)</button></div>
    <div class="g">
      <div><label>Pair</label><select id="pair"></select></div>
      <div><label>Timeframe</label><select id="tf"></select></div>
    </div>
    <label style="margin-top:10px">Strategies</label>
    <div class="ch" id="chips"></div>
    <label class="ch" style="display:flex;gap:6px;align-items:center;margin-top:10px;font-size:13px;color:var(--tx)"><input id="prof" type="checkbox" checked style="width:auto"> Sirf profitable record wale dikhao</label>
    <div style="margin-top:10px"><label>Twelve Data API key</label><input id="key" type="password" placeholder="API key"></div>
    <button id="go">Scan karo</button>
    <div id="msg" class="note"></div>
  </div>
  <div id="out"></div>
  <div class="note">Signal tool hai, profit guarantee nahi. Pehle demo pe test karo. Past record spread ke bina ek andaza hai.</div>
</div>
</main>
<script>
const $=id=>document.getElementById(id);
async function sha(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('smc|'+s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
let stored=null;try{stored=localStorage.getItem('smc_pw');$('key').value=localStorage.getItem('smc_key')||''}catch(e){}
if(!stored){$('lockLbl').textContent='Naya password set karo (min 6 characters)';$('lockBtn').textContent='Set password'}
$('lockBtn').onclick=async()=>{const p=$('pw').value;
  if(!stored){if(p.length<6){$('lockErr').textContent='Kam se kam 6 characters.';return}try{localStorage.setItem('smc_pw',await sha(p))}catch(e){}unlock()}
  else if(await sha(p)===stored)unlock();else $('lockErr').textContent='Galat password.'};
$('pw').addEventListener('keydown',e=>{if(e.key==='Enter')$('lockBtn').click()});
function unlock(){$('lock').style.display='none';$('app').style.display='block'}
/*P*/
const PAIRS=['EUR/USD','GBP/USD','USD/JPY','USD/CHF','AUD/USD','NZD/USD','USD/CAD','EUR/GBP','EUR/JPY','GBP/JPY','AUD/JPY','EUR/AUD','XAU/USD'];
const MODES={scalp:{tf:['1min','5min','15min'],k:1.2,r1:1,r2:2},intra:{tf:['15min','30min','1h','4h'],k:1.8,r1:1.5,r2:3}};
const STR=[['eng','Engulfing (PA)'],['pin','Pin Bar (PA)'],['inb','Inside Bar (PA)'],['sweep','Liquidity Sweep (SMC)'],['fvg','FVG Retest (SMC/ICT)'],['ob','Order Block (SMC)'],['ict','ICT Kill Zone'],['pull','Trend Pullback']];
function ema(a,n){const k=2/(n+1),o=[a[0]];for(let i=1;i<a.length;i++)o.push(a[i]*k+o[i-1]*(1-k));return o}
function mn(x,a,b){let m=1e18;for(let j=a;j<=b;j++)m=Math.min(m,x[j]);return m}
function prep(v){
  const o=v.map(x=>+x.open),h=v.map(x=>+x.high),l=v.map(x=>+x.low),c=v.map(x=>+x.close),n=c.length,a=new Array(n).fill(0),t=[0];
  for(let i=1;i<n;i++){t[i]=Math.max(h[i]-l[i],Math.abs(h[i]-c[i-1]),Math.abs(l[i]-c[i-1]));if(i>=14){let s=0;for(let j=i-13;j<=i;j++)s+=t[j];a[i]=s/14}}
  const hr=v.map(x=>+x.datetime.slice(11,13)),e20=ema(c,20),e50=ema(c,50),ng=z=>z.map(x=>-x);
  return[{o,h,l,c,a,e20,e50,hr},{o:ng(o),h:ng(l),l:ng(h),c:ng(c),a,e20:ng(e20),e50:ng(e50),hr}];
}
// sab strategies sirf BUY ke liye likhi hain; SELL ke liye price ulta (mirror) karke chalate hain
const S={
eng:(D,i)=>{const{o,l,c,a}=D;if(c[i-1]<o[i-1]&&c[i]>o[i-1]&&o[i]<=c[i-1]&&c[i]>o[i]&&l[i]<=mn(l,i-10,i-1)+.3*a[i])return{e:c[i],sl:l[i]-.1*a[i]}},
pin:(D,i)=>{const{o,h,l,c,a}=D,b=Math.abs(c[i]-o[i]),w=Math.min(o[i],c[i])-l[i],r=h[i]-l[i];if(r>0&&w>=2*b&&w>=.55*r&&l[i]<=mn(l,i-8,i-1))return{e:c[i],sl:l[i]-.1*a[i]}},
inb:(D,i)=>{const{h,l,c,a,e50}=D;if(h[i-1]<h[i-2]&&l[i-1]>l[i-2]&&c[i]>h[i-2]&&c[i]>e50[i])return{e:c[i],sl:l[i-1]-.1*a[i]}},
sweep:(D,i)=>{const{o,l,c,a}=D,s=mn(l,i-12,i-2);if(l[i]<s&&c[i]>s&&c[i]>o[i])return{e:c[i],sl:l[i]-.1*a[i]}},
ict:(D,i)=>{const h=D.hr[i];if((h>=7&&h<10)||(h>=12&&h<15))return S.sweep(D,i)},
fvg:(D,i)=>{const{o,h,l,c,a,e50}=D;if(c[i]<=e50[i])return;for(let k=i-2;k>=i-10;k--)if(l[k]>h[k-2]&&l[k]-h[k-2]>=.2*a[i]){if(l[i]<=l[k]&&c[i]>h[k-2]&&c[i]>o[i])return{e:c[i],sl:h[k-2]-.15*a[i]};return}},
ob:(D,i)=>{const{o,h,l,c,a}=D;for(let k=i-3;k>=i-15;k--)if(o[k]>c[k]&&c[k+1]-o[k+1]>1.2*a[i]&&c[k+1]>h[k]){if(l[i]<=h[k]&&c[i]>o[i]&&c[i]>l[k])return{e:c[i],sl:l[k]-.1*a[i]};return}},
pull:(D,i)=>{const{o,l,c,a,e20,e50}=D;if(e20[i]>e50[i]&&e20[i]>e20[i-5]&&l[i]<=e20[i]&&c[i]>e20[i]&&c[i]>o[i])return{e:c[i],sl:Math.min(l[i],l[i-1])-.1*a[i]}}
};
function sig(D,i,id,P){
  const a=D.a[i];if(!(a>0))return null;const r=S[id](D,i);if(!r)return null;
  let risk=r.e-r.sl;if(!(risk>0))return null;
  risk=Math.min(Math.max(risk,.5*a),P.k*a);return{e:r.e,sl:r.e-risk,risk};
}
function bt(D,id,P){
  const n=D.c.length,R=[];
  for(let i=60;i<n-1;i++){
    const s=sig(D,i,id,P);if(!s)continue;const tp=s.e+P.r1*s.risk;let r=null;
    for(let j=i+1;j<Math.min(n,i+41);j++){if(D.l[j]<=s.sl){r=-1;break}if(D.h[j]>=tp){r=P.r1;break}}
    if(r!==null){R.push(r-.05);i+=3}
  }
  return R;
}
function analyze(v,P,ids){
  const[B,M]=prep(v),n=v.length,out=[];
  for(const id of ids){
    const R=bt(B,id,P).concat(bt(M,id,P));
    const st={n:R.length,win:R.length?R.filter(x=>x>0).length/R.length:0,avg:R.length?R.reduce((a,b)=>a+b,0)/R.length:0};
    for(const[X,d]of[[B,'BUY'],[M,'SELL']]){
      const s=sig(X,n-1,id,P);if(!s)continue;const q=d=='BUY'?1:-1;
      out.push({id,dir:d,e:q*s.e,sl:q*s.sl,tp1:q*(s.e+P.r1*s.risk),tp2:q*(s.e+P.r2*s.risk),...st});
    }
  }
  return out;
}
/*E*/
let mode='scalp';
PAIRS.forEach(p=>$('pair').add(new Option(p)));$('pair').add(new Option('Sab pairs (scan)','ALL'),0);$('pair').value='EUR/USD';
STR.forEach(s=>$('chips').insertAdjacentHTML('beforeend',`<label><input type="checkbox" id="c_${s[0]}" checked> ${s[1]}</label>`));
function setMode(m){mode=m;$('m_scalp').className=m=='scalp'?'on':'';$('m_intra').className=m=='intra'?'on':'';
  $('tf').innerHTML='';$('tf').add(new Option('Sab timeframes','ALL'));MODES[m].tf.forEach(t=>$('tf').add(new Option(t)));$('tf').value='ALL'}
$('m_scalp').onclick=()=>setMode('scalp');$('m_intra').onclick=()=>setMode('intra');setMode('scalp');
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
let busy=false;
$('go').onclick=async()=>{
  if(busy)return;const key=$('key').value.trim();if(!key){$('msg').textContent='Pehle API key daalo.';return}
  try{localStorage.setItem('smc_key',key)}catch(e){}
  const P=MODES[mode],pairs=$('pair').value=='ALL'?PAIRS:[$('pair').value],tfs=$('tf').value=='ALL'?P.tf:[$('tf').value];
  const ids=STR.map(s=>s[0]).filter(id=>$('c_'+id).checked);if(!ids.length){$('msg').textContent='Kam se kam ek strategy chuno.';return}
  const jobs=[];pairs.forEach(p=>tfs.forEach(t=>jobs.push([p,t])));
  busy=true;$('go').disabled=true;let res=[],err='';
  for(let q=0;q<jobs.length;q++){
    $('msg').textContent=`Scan ${q+1}/${jobs.length}: ${jobs[q][0]} ${jobs[q][1]} (free key limit ke liye thoda wait lagta hai)`;
    if(q)await sleep(7600);
    try{
      const u=`https://api.twelvedata.com/time_series?symbol=${encodeURIComponent(jobs[q][0])}&interval=${jobs[q][1]}&outputsize=1000&order=ASC&timezone=UTC&apikey=${encodeURIComponent(key)}`;
      const r=await (await fetch(u)).json();
      if(r.status==='error'||!r.values)throw Error(r.message||'Data nahi mila');
      const v=r.values.slice(0,-1);if(v.length<150)throw Error('Kam candles');
      analyze(v,P,ids).forEach(x=>res.push({...x,pair:jobs[q][0],tf:jobs[q][1]}));
    }catch(e){err=jobs[q][0]+' '+jobs[q][1]+': '+e.message;break}
    show(res,P);
  }
  show(res,P);$('msg').textContent=err?('Error: '+err):'Scan poora hua.';busy=false;$('go').disabled=false;
};
function show(res,P){
  const only=$('prof').checked;
  let L=res.map(x=>({...x,ok:x.n>=15&&x.avg>0}));if(only)L=L.filter(x=>x.ok);
  L.sort((a,b)=>b.avg-a.avg);
  if(!L.length){$('out').innerHTML='<div class="card">Abhi koi setup nahi. Thodi der baad dubara scan karo, ya "profitable" filter band karke dekho.</div>';return}
  const nm=Object.fromEntries(STR);
  $('out').innerHTML=L.map(x=>{const d=x.pair.includes('JPY')?3:x.pair.startsWith('XAU')?2:5,f=z=>z.toFixed(d);
    return`<div class="card"><div class="h"><b>${x.pair} · ${x.tf}</b><span class="tag ${x.dir=='BUY'?'buy':'sell'}">${x.dir}</span></div>
    <div class="note" style="margin-top:2px">${nm[x.id]}</div>
    <div class="gr"><div>Entry<b>${f(x.e)}</b></div><div>SL<b>${f(x.sl)}</b></div><div>TP1 (${P.r1}R)<b>${f(x.tp1)}</b></div><div>TP2 (${P.r2}R)<b>${f(x.tp2)}</b></div></div>
    <div class="note">Past record: ${x.n} trades, win ${(x.win*100).toFixed(0)}%, avg ${x.avg>=0?'+':''}${x.avg.toFixed(2)}R ${x.ok?'':'(kamzor)'}</div></div>`}).join('');
}
</script>
</body>
</html>
