<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SMC Live Signal</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#14171c;--mu:#5d6673;--ac:#0b6bcb;--gd:#0a8f4e;--rd:#d12f3a;--bd:#dde1e7;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1116;--card:#171b22;--tx:#e8ebf0;--mu:#9099a6;--ac:#4c9bff;--gd:#3ccf85;--rd:#ff6b75;--bd:#262c36;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1116;--card:#171b22;--tx:#e8ebf0;--mu:#9099a6;--ac:#4c9bff;--gd:#3ccf85;--rd:#ff6b75;--bd:#262c36;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:4px 0 12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
label{display:block;font-size:12px;color:var(--mu);margin-bottom:3px}
input,select,button{font:inherit;border-radius:8px;border:1px solid var(--bd);padding:10px;background:var(--bg);color:var(--tx);width:100%}
button{background:var(--ac);color:#fff;border:0;font-weight:600;margin-top:10px}
.g{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.note{font-size:12px;color:var(--mu);margin-top:8px}
.err{color:var(--rd);font-size:13px;margin-top:6px}
.big{font-size:26px;font-weight:800;margin:4px 0}
.buy{color:var(--gd)}.sell{color:var(--rd)}
.chk{display:flex;gap:8px;align-items:center;margin-top:10px;font-size:14px}
.chk input{width:auto}
#app{display:none}
</style>
</head>
<body>
<main>
<div id="lock" class="card" style="margin-top:12vh">
  <h1>🔒 SMC Live Signal</h1>
  <label id="lockLbl">Password</label>
  <input id="pw" type="password">
  <button id="lockBtn">Login</button>
  <div id="lockErr" class="err"></div>
  <div class="note">Ye lock sirf is browser mein hai, asli server security nahi.</div>
</div>

<div id="app">
  <h1>SMC Live Signal (BOS + FVG)</h1>
  <div class="card">
    <label>Twelve Data API key (free, twelvedata.com)</label>
    <input id="key" type="password" placeholder="apni API key paste karo">
    <div class="g">
      <div><label>Pair</label><select id="sym"><option>EUR/USD</option><option>GBP/USD</option><option>USD/JPY</option><option>AUD/USD</option><option>XAU/USD</option></select></div>
      <div><label>Timeframe</label><select id="tf"><option value="5min">5 min</option><option value="15min" selected>15 min</option><option value="30min">30 min</option><option value="1h">1 hour</option></select></div>
    </div>
    <button id="go">Signal check karo</button>
    <label class="chk"><input id="auto" type="checkbox"> Har 2 minute auto-check (page khula rakho)</label>
    <div id="msg" class="err"></div>
  </div>
  <div id="out"></div>
  <div class="note">Ye signal tool hai, profit guarantee nahi. Pehle demo account pe test karo. Weekend pe forex band hota hai.</div>
</div>
</main>
<script>
const $=id=>document.getElementById(id);
async function sha(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('smc|'+s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
let stored=null;try{stored=localStorage.getItem('smc_pw');$('key').value=localStorage.getItem('smc_key')||''}catch(e){}
if(!stored){$('lockLbl').textContent='Naya password set karo (min 6 characters)';$('lockBtn').textContent='Set password'}
$('lockBtn').onclick=async()=>{
  const p=$('pw').value;
  if(!stored){
    if(p.length<6){$('lockErr').textContent='Kam se kam 6 characters.';return}
    try{localStorage.setItem('smc_pw',await sha(p))}catch(e){}
    unlock();
  }else if(await sha(p)===stored)unlock();else $('lockErr').textContent='Galat password.';
};
$('pw').addEventListener('keydown',e=>{if(e.key==='Enter')$('lockBtn').click()});
function unlock(){$('lock').style.display='none';$('app').style.display='block'}

const N=3,RR=2,SLB=0.1,MINF=0.3;
function atr(d,n=14){const a=new Array(d.c.length).fill(NaN),tr=[0];
  for(let i=1;i<d.c.length;i++){tr[i]=Math.max(d.h[i]-d.l[i],Math.abs(d.h[i]-d.c[i-1]),Math.abs(d.l[i]-d.c[i-1]));
    if(i>=n){let s=0;for(let j=i-n+1;j<=i;j++)s+=tr[j];a[i]=s/n}}return a}
function scan(d){
  const{h,l,c}=d,n=c.length,a=atr(d);let lsh=null,lsl=null,bias=0,bos=-1e9,pend=null,sig=null;
  for(let i=N*2+15;i<n;i++){
    const k=i-N;let mx=-1e9,mn=1e9;
    for(let j=k-N;j<=k+N;j++){mx=Math.max(mx,h[j]);mn=Math.min(mn,l[j])}
    if(h[k]===mx)lsh=h[k];if(l[k]===mn)lsl=l[k];
    if(lsh!==null&&c[i]>lsh&&c[i-1]<=lsh){bias=1;bos=i;lsh=null}
    else if(lsl!==null&&c[i]<lsl&&c[i-1]>=lsl){bias=-1;bos=i;lsl=null}
    if(bias&&i-bos<=30&&!isNaN(a[i])){
      if(bias==1&&l[i]>h[i-2]&&l[i]-h[i-2]>=MINF*a[i])pend={d:1,top:l[i],bot:h[i-2],sl:l[i-2]-SLB*a[i],born:i};
      else if(bias==-1&&h[i]<l[i-2]&&l[i-2]-h[i]>=MINF*a[i])pend={d:-1,top:l[i-2],bot:h[i],sl:h[i-2]+SLB*a[i],born:i};
      if(pend&&pend.born==i)continue;
    }
    if(pend){
      if(i-pend.born>40||bias!=pend.d){pend=null;continue}
      if(pend.d==1&&l[i]<=pend.top){const e=pend.top,r=e-pend.sl;if(r>0&&l[i]>pend.sl&&i==n-1)sig={s:'BUY',e,sl:pend.sl,tp:e+RR*r};pend=null}
      else if(pend.d==-1&&h[i]>=pend.bot){const e=pend.bot,r=pend.sl-e;if(r>0&&h[i]<pend.sl&&i==n-1)sig={s:'SELL',e,sl:pend.sl,tp:e-RR*r};pend=null}
    }
  }
  return{bias,pend,sig};
}
async function check(){
  const key=$('key').value.trim();
  if(!key){$('msg').textContent='Pehle API key daalo.';return}
  try{localStorage.setItem('smc_key',key)}catch(e){}
  $('msg').textContent='Data la raha hu...';
  try{
    const u=`https://api.twelvedata.com/time_series?symbol=${encodeURIComponent($('sym').value)}&interval=${$('tf').value}&outputsize=500&order=ASC&apikey=${encodeURIComponent(key)}`;
    const r=await (await fetch(u)).json();
    if(r.status==='error'||!r.values)throw Error(r.message||'Data nahi mila');
    const v=r.values.slice(0,-1);
    if(v.length<60)throw Error('Kam candles mile');
    const d={h:v.map(x=>+x.high),l:v.map(x=>+x.low),c:v.map(x=>+x.close)};
    const t=v[v.length-1].datetime,res=scan(d),last=d.c[d.c.length-1];
    const dec=last>500?2:last>50?3:5,f=x=>x.toFixed(dec);
    const b={1:'Bullish',[-1]:'Bearish',0:'Neutral'}[res.bias];
    let html;
    if(res.sig){const s=res.sig;
      html=`<div class="big ${s.s=='BUY'?'buy':'sell'}">${s.s} NOW</div><div>Entry <b>${f(s.e)}</b></div><div>SL <b>${f(s.sl)}</b> &nbsp; TP <b>${f(s.tp)}</b> (RR 1:${RR})</div>`;
      if(navigator.vibrate)navigator.vibrate([200,100,200]);
    }else if(res.pend){const p=res.pend,lv=p.d==1?p.top:p.bot;
      html=`<div class="big">WAIT</div><div>${p.d==1?'BUY':'SELL'} setup ban raha hai. Price <b>${f(lv)}</b> tak aaye to entry, SL <b>${f(p.sl)}</b></div>`;
    }else html=`<div class="big">NO SETUP</div><div>Abhi trade mat lo.</div>`;
    $('out').innerHTML=`<div class="card">${html}<div class="note">${$('sym').value} ${$('tf').value} | Bias: ${b} | Last closed candle: ${t} | Last price: ${f(last)}</div></div>`;
    $('msg').textContent='';
  }catch(e){$('msg').textContent='Error: '+e.message}
}
$('go').onclick=check;
let timer=null;
$('auto').onchange=()=>{clearInterval(timer);if($('auto').checked){check();timer=setInterval(check,120000)}};
</script>
</body>
                                                 </html>
